name: StudioPortal
options:
  bundleIdPrefix: local.beispiel
  deploymentTarget:
    iOS: "18.0"
targets:
  StudioPortal:
    type: application
    platform: iOS
    sources: [StudioPortal]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.beispiel.studioportal.iphone
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: StudioPortal
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Sendet dein Diktat über Tailscale an deinen Mac mini zur lokalen Whisper-Erkennung.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Speichert erzeugte Bilder und Videos in deinen Fotos.
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
